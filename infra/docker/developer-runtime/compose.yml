name: exitpass-developer-runtime

services:
  postgres:
    image: postgres:16-alpine
    container_name: exitpass-dev-synthetic-db
    environment:
      POSTGRES_DB: exitpass_dev
      POSTGRES_USER: exitpass_dev
      POSTGRES_PASSWORD: ${DEVELOPER_DATABASE_PASSWORD}
    volumes:
      - exitpass-dev-synthetic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exitpass_dev -d exitpass_dev"]
      interval: 2s
      timeout: 3s
      retries: 60
    labels:
      com.exitpass.runtime-profile: DEVELOPER
      com.exitpass.resource-owner: developer-runtime
    networks: [developer]

  hikcentral:
    image: wiremock/wiremock:3.9.2
    container_name: exitpass-dev-hikcentral
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ${DEVELOPER_STATE_ROOT}/wiremock:/home/wiremock:ro
    ports:
      - "127.0.0.1:58080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    labels:
      com.exitpass.runtime-profile: DEVELOPER
      com.exitpass.resource-owner: developer-runtime
    networks: [developer]

  site-adapter:
    image: exitpass-site-adapter-developer:${SOURCE_REVISION}
    build:
      context: ${SOURCE_ROOT}
      dockerfile: src/Services/VendorPmsAdapter/src/ExitPass.VendorPmsAdapter.Api/Dockerfile
    container_name: exitpass-dev-site-adapter
    environment:
      # Existing task-owned HTTP support is deliberately restricted to this host environment.
      ASPNETCORE_ENVIRONMENT: IntegrationTest
      ASPNETCORE_URLS: http://+:8080
      EXITPASS_RUNTIME_PROFILE: DEVELOPER
      EXITPASS_RUNTIME_PROFILE_LABEL: DEVELOPER - SIMULATED HIKCENTRAL
      SiteAdapter__Activated: "true"
      SiteAdapter__SiteId: 12000000-0000-0000-0000-000000000302
      SiteAdapter__SiteGroupId: 12000000-0000-0000-0000-000000000301
      SiteAdapter__VendorSystemId: de100000-0000-0000-0000-000000000003
      SiteAdapter__AdapterIdentityId: de100000-0000-0000-0000-000000000004
      SiteAdapter__AllowedCentralPmsServiceIdentityId: 12000000-0000-0000-0000-000000000002
      SiteAdapter__AdapterEndpointIdentity: exitpass-dev-site-adapter
      SiteAdapter__Environment: DEVELOPER
      SiteAdapter__ParkingLotIndexCode: DEV-LOT-1
      SiteAdapter__HikCentralBaseUrl: http://exitpass-dev-hikcentral:8080
      SiteAdapter__SecretMountRoot: /run/secrets/site-adapter
      SiteAdapter__HikCentralAppKeyFile: /run/secrets/site-adapter/app-key
      SiteAdapter__HikCentralAppSecretFile: /run/secrets/site-adapter/app-secret
      SiteAdapter__CentralPmsApiKeyFile: /run/secrets/site-adapter/central-key
      SiteAdapter__HikCentralUserId: exitpass-developer-adapter
      SiteAdapter__HikCentralApiVersion: 3.1.0
      SiteAdapter__RequestTimeZoneId: Asia/Manila
      SiteAdapter__TimeoutSeconds: "10"
      SiteAdapter__MaxRetries: "0"
      SiteAdapter__ConfirmPaymentEnabled: "true"
      SiteAdapter__AllowTaskOwnedHttp: "true"
      SiteAdapter__AllowedOperations__0: IDENTITY_READ
      SiteAdapter__AllowedOperations__1: SESSION_RESOLUTION
      SiteAdapter__AllowedOperations__2: TARIFF_CALCULATION
      SiteAdapter__AllowedOperations__3: PASSAGEWAY_SYNCHRONIZATION
      SiteAdapter__AllowedOperations__4: PAYMENT_CONFIRMATION
      HIKCENTRAL_CONFIRM_PAYMENT_ENABLED: "true"
    volumes:
      - ${DEVELOPER_STATE_ROOT}/secrets/site-adapter:/run/secrets/site-adapter:ro
    ports:
      - "127.0.0.1:58081:8080"
    depends_on:
      hikcentral:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ $$status == *\" 200 \"* ]]'"]
      interval: 2s
      timeout: 3s
      retries: 60
    labels:
      com.exitpass.runtime-profile: DEVELOPER
      com.exitpass.resource-owner: developer-runtime
    networks: [developer]

networks:
  developer:
    name: exitpass-dev-synthetic
    labels:
      com.exitpass.runtime-profile: DEVELOPER
      com.exitpass.resource-owner: developer-runtime

volumes:
  exitpass-dev-synthetic-data:
    name: exitpass-dev-synthetic-data
    labels:
      com.exitpass.runtime-profile: DEVELOPER
      com.exitpass.resource-owner: developer-runtime
